<!DOCTYPE html>
<html lang="ja">
<head>
  <link
  rel="manifest"
  href="./manifest.json"
>

<meta
  name="theme-color"
  content="#1d4ed8"
>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>開票速報シミュレーション</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  background: #f3f4f6;
  color: #222;
}

/* =========================
   ヘッダー
========================= */

header {
  background: #172554;
  color: white;
  padding: 12px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.header-sub {
  font-size: 12px;
  opacity: 0.8;
  margin-top: 3px;
}

/* =========================
   ナビゲーション
========================= */

nav {
  display: flex;
  overflow-x: auto;
  background: white;
  border-bottom: 1px solid #ddd;
  position: sticky;
  top: 60px;
  z-index: 999;
}

nav button {
  flex: 0 0 auto;
  border: none;
  background: white;
  padding: 12px 18px;
  font-size: 14px;
  cursor: pointer;
}

nav button.active {
  color: #1d4ed8;
  font-weight: bold;
  border-bottom: 3px solid #1d4ed8;
}

/* =========================
   ページ
========================= */

.page {
  display: none;
  padding: 12px;
  max-width: 1100px;
  margin: auto;
}

.page.active {
  display: block;
}

/* =========================
   カード
========================= */

.card {
  background: white;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.card-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 10px;
}

/* =========================
   全国概要
========================= */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.summary-box {
  background: #f8fafc;
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}

.summary-label {
  font-size: 12px;
  color: #666;
}

.summary-value {
  font-size: 22px;
  font-weight: bold;
  margin-top: 4px;
}

/* =========================
   都道府県MAP
========================= */

.map-container {
  height: 70vh;
  min-height: 500px;
  overflow-y: auto;
  overflow-x: hidden;

  background: #eef2ff;
  border-radius: 12px;
  padding: 10px;

  scroll-behavior: smooth;
}

/*
  北海道 → 青森 → 岩手……
  の順に上から並ぶ
*/

.pref-map {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.pref-button {
  min-height: 55px;
  border: 1px solid #c7d2fe;
  border-radius: 8px;

  background: white;
  color: #172554;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.15s;
}

.pref-button:hover {
  background: #dbeafe;
}

.pref-button:active {
  transform: scale(0.97);
}

.pref-number {
  display: block;
  font-size: 10px;
  color: #64748b;
  margin-bottom: 3px;
}

/* =========================
   都道府県選択
========================= */

select,
input {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
  background: white;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-top: 10px;
  margin-bottom: 4px;
}

/* =========================
   ボタン
========================= */

button {
  font-family: inherit;
}

.btn {
  border: none;
  border-radius: 7px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
}

.btn-primary {
  background: #1d4ed8;
  color: white;
}

.btn-success {
  background: #15803d;
  color: white;
}

.btn-warning {
  background: #d97706;
  color: white;
}

.btn-danger {
  background: #dc2626;
  color: white;
}

.btn-gray {
  background: #64748b;
  color: white;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

/* =========================
   選挙区
========================= */

.district-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.district-name {
  font-size: 20px;
  font-weight: bold;
}

.status {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
}

.status-counting {
  background: #fef3c7;
  color: #92400e;
}

.status-called {
  background: #dcfce7;
  color: #166534;
}

.status-final {
  background: #dbeafe;
  color: #1e40af;
}

/* =========================
   開票情報
========================= */

.counting-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.counting-box {
  background: #f8fafc;
  border-radius: 8px;
  padding: 10px;
}

.counting-label {
  font-size: 11px;
  color: #64748b;
}

.counting-value {
  font-size: 18px;
  font-weight: bold;
  margin-top: 3px;
}

/* =========================
   候補者
========================= */

.candidate {
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  padding: 11px;
  margin-bottom: 8px;
  background: white;
}

.candidate-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.candidate-name {
  font-weight: bold;
  font-size: 16px;
}

.candidate-party {
  font-size: 12px;
  color: #64748b;
}

.candidate-votes {
  font-size: 18px;
  font-weight: bold;
  text-align: right;
}

.vote-bar-bg {
  height: 9px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.vote-bar {
  height: 100%;
  background: #2563eb;
  border-radius: 10px;
  transition: width 0.3s;
}

.vote-percent {
  font-size: 12px;
  color: #475569;
  margin-top: 4px;
}

/* =========================
   当確・議席確定
========================= */

.result-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
}

.badge {
  display: inline-block;
  padding: 4px 7px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: bold;
}

.badge-called {
  background: #dcfce7;
  color: #166534;
}

.badge-elected {
  background: #dbeafe;
  color: #1e40af;
}

.badge-proportional {
  background: #f3e8ff;
  color: #7e22ce;
}

/* ==================================================
   半円議席グラフ
================================================== */

.half-seat-chart {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}


/* 半円の外側 */

.half-seat-pie {
  width: 300px;
  height: 150px;

  position: relative;

  overflow: hidden;
}


/* 色付きの円 */

.half-seat-pie-color {
  width: 300px;
  height: 300px;

  border-radius: 50%;

  position: absolute;

  left: 0;
  top: 0;
}


/* 中央のくり抜き */

.half-seat-hole {
  position: absolute;

  width: 150px;
  height: 150px;

  border-radius: 50%;

  background: white;

  left: 75px;
  top: 75px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
}


.half-seat-hole strong {
  font-size: 28px;
}


.half-seat-hole span {
  font-size: 13px;
}


/* 与党・未確定・野党 */

.half-seat-summary {
  width: 100%;

  display: flex;

  justify-content: space-around;

  text-align: center;

  margin-top: 12px;
}


.half-seat-summary div {
  display: flex;
  flex-direction: column;
  gap: 4px;
}


.half-seat-summary strong {
  font-size: 15px;
}


.half-seat-summary span {
  font-size: 13px;
}


/* 政党別 */

.half-seat-info {
  width: 100%;
  max-width: 500px;
}
/* =========================
   比例代表
========================= */

.proportional-party {
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  padding: 11px;
  margin-bottom: 8px;
}

.proportional-top {
  display: flex;
  justify-content: space-between;
}

.proportional-party-name {
  font-weight: bold;
}

.proportional-votes {
  font-weight: bold;
}

.proportional-bar-bg {
  height: 8px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 7px;
}

.proportional-bar {
  height: 100%;
  background: #7c3aed;
}

/* =========================
   入力フォーム
========================= */

.editor-row {
  border: 1px solid #e2e8f0;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

.editor-title {
  font-weight: bold;
  margin-bottom: 5px;
}

.editor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

/* =========================
   フッター
========================= */

footer {
  text-align: center;
  font-size: 11px;
  color: #64748b;
  padding: 25px 10px;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .pref-map {
    grid-template-columns: repeat(2, 1fr);
  }

  .summary-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .counting-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .candidate-top {
    align-items: flex-start;
  }

  .district-name {
    font-size: 18px;
  }

}

/* =========================
   大きい画面
========================= */

@media (min-width: 900px) {

  .pref-map {
    grid-template-columns: repeat(5, 1fr);
  }

  .summary-grid {
    grid-template-columns: repeat(4, 1fr);
  }

  .counting-grid {
    grid-template-columns: repeat(4, 1fr);
  }

}

</style>
</head>

/* ==================================================
   数値表示
================================================== */

function formatNumber(number) {

  return Number(number || 0).toLocaleString("ja-JP");

}


/* ==================================================
   パーセント
================================================== */

function formatPercent(value) {

  if (!isFinite(value)) {
    return "0.0%";
  }

  return value.toFixed(1) + "%";

}


/* ==================================================
   開票率
   入力済み投票数 ÷ 投票者数
================================================== */

function calculateOpeningRate(data) {

  if (!data) {
    return 0;
  }


  const totalVotes = data.candidates.reduce(
    (sum, candidate) => {

      return sum + Number(candidate.votes || 0);

    },
    0
  );


  if (Number(data.voters) <= 0) {
    return 0;
  }


  return (
    totalVotes /
    Number(data.voters) *
    100
  );

}


/* ==================================================
   投票率
   投票者数 ÷ 有権者数
================================================== */

function calculateTurnoutRate(data) {

  if (!data) {
    return 0;
  }


  const eligible =
    Number(data.eligibleVoters || 0);

  const voters =
    Number(data.voters || 0);


  if (eligible <= 0) {
    return 0;
  }


  return (
    voters /
    eligible *
    100
  );

}


/* ==================================================
   比例代表の開票率
================================================== */

function calculateProportionalOpening(data) {

  if (!data) {
    return 0;
  }


  const totalVotes =
    data.parties.reduce(
      (sum, party) => {

        return sum +
          Number(party.votes || 0);

      },
      0
    );


  if (Number(data.voters) <= 0) {
    return 0;
  }


  return (
    totalVotes /
    Number(data.voters) *
    100
  );

}


/* ==================================================
   比例代表の投票率
================================================== */

function calculateProportionalTurnout(data) {

  if (!data) {
    return 0;
  }


  const eligible =
    Number(data.eligibleVoters || 0);

  const voters =
    Number(data.voters || 0);


  if (eligible <= 0) {
    return 0;
  }


  return (
    voters /
    eligible *
    100
  );

}

function displayDistrict() {

  }


  const data =
    getCurrentDistrict();


  if (!data) {

    container.innerHTML =
      `<div class="card">

      </div>`;

    return;

  }


  /*
   * 投票者数
   */

  const voters =
    Number(data.voters || 0);


  /*
   * 有権者数
   */

  const eligible =
    Number(
      data.eligibleVoters || 0
    );


  /*
   * 入力済み票
   */

  const totalVotes =
    data.candidates.reduce(
      (sum, candidate) => {

        return sum +
          Number(candidate.votes || 0);

      },
      0
    );


  /*
   * 投票率
   */

  const turnoutRate =
    calculateTurnoutRate(data);


  /*
   * 開票率
   */

  const openingRate =
    calculateOpeningRate(data);


  /*
   * 候補者を得票順にする
   */

  const candidates =
    [...data.candidates]
      .sort(
        (a, b) =>
          Number(b.votes || 0) -
          Number(a.votes || 0)
      );


  /*
   * 状態
   */

  let statusText =
    "開票中";

  let statusClass =
    "status-counting";


  const elected =
    candidates.find(
      candidate =>
        candidate.elected
    );


  if (elected) {

    statusText =
      "議席確定";

    statusClass =
      "status-final";

  } else {

    const called =
      candidates.find(
        candidate =>
          candidate.called
      );


    if (called) {

      statusText =
        "当確";

      statusClass =
        "status-called";

    }

  }


  let html = `

    <div class="card">

      <div class="district-header">

        <div class="district-name">
          第${data.district}区
        </div>

        <div class="status ${statusClass}">
          ${statusText}
        </div>

      </div>


      <div class="counting-grid">

        <div class="counting-box">

          <div class="counting-label">
            有権者数
          </div>

          <div class="counting-value">
            ${formatNumber(eligible)}人
          </div>

        </div>


        <div class="counting-box">

          <div class="counting-label">
            投票者数
          </div>

          <div class="counting-value">
            ${formatNumber(voters)}人
          </div>

        </div>


        <div class="counting-box">

          <div class="counting-label">
            投票率
          </div>

          <div class="counting-value">
            ${formatPercent(turnoutRate)}
          </div>

        </div>


        <div class="counting-box">

          <div class="counting-label">
            開票率
          </div>

          <div class="counting-value">
            ${formatPercent(openingRate)}
          </div>

        </div>

      </div>

    </div>

  `;


  /*
   * 候補者
   */

  candidates.forEach(
    candidate => {

      const votes =
        Number(candidate.votes || 0);


      const percent =
        totalVotes > 0
          ? votes / totalVotes * 100
          : 0;


      html += `

        <div class="card candidate">

          <div class="candidate-top">

            <div>

              <div class="candidate-name">
                ${escapeHTML(candidate.name)}
              </div>

              <div class="candidate-party">
                ${escapeHTML(candidate.party)}
              </div>

            </div>


            <div class="candidate-votes">
              ${formatNumber(votes)}票
            </div>

          </div>


          <div class="vote-bar-bg">

            <div
              class="vote-bar"
              style="width:${percent}%">
            </div>

          </div>


          <div class="vote-percent">
            得票率 ${formatPercent(percent)}
          </div>


          <div class="result-badges">

            ${
              candidate.called
              ? `
                <span class="badge badge-called">
                  当確
                </span>
              `
              : ""
            }


            ${
              candidate.elected
              ? `
                <span class="badge badge-elected">
                  議席確定
                </span>
              `
              : ""
            }

          </div>

        </div>

      `;

    }
  );


  container.innerHTML = html;

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* ==================================================
   全国集計
================================================== */

function updateNationalSummary() {

  let singleElected = 0;
  let singleCalled = 0;

  let nationalEligible = 0;
  let nationalVoters = 0;
  let nationalVotes = 0;


  /* 小選挙区 */

  Object.values(electionData.districts).forEach(
    districts => {

      districts.forEach(district => {

        nationalEligible +=
          Number(district.eligibleVoters || 0);

        nationalVoters +=
          Number(district.voters || 0);


        district.candidates.forEach(candidate => {

          nationalVotes +=
            Number(candidate.votes || 0);


          if (candidate.called) {
            singleCalled++;
          }


          if (candidate.elected) {
            singleElected++;
          }

        });

      });

    }
  );


  /* 比例代表 */

  let proportionalElected = 0;
  let proportionalCalled = 0;

  let proportionalEligible = 0;
  let proportionalVoters = 0;
  let proportionalVotes = 0;


  Object.values(electionData.proportional).forEach(
    block => {

      proportionalEligible +=
        Number(block.eligibleVoters || 0);

      proportionalVoters +=
        Number(block.voters || 0);


      block.parties.forEach(party => {

        proportionalVotes +=
          Number(party.votes || 0);


        if (party.called) {
          proportionalCalled++;
        }


        proportionalElected +=
          Number(party.electedSeats || 0);

      });

    }
  );


  /* =========================
     小選挙区
  ========================= */

  const singleElement =
    document.getElementById("summary-single");


  if (singleElement) {

    singleElement.textContent =
      `${singleElected} / ${TOTAL_SINGLE_SEATS}`;

  }


  /* =========================
     比例代表
  ========================= */

  const proportionalElement =
    document.getElementById(
      "summary-proportional"
    );


  if (proportionalElement) {

    proportionalElement.textContent =
      `${proportionalElected} / ${TOTAL_PR_SEATS}`;

  }


  /* =========================
     合計議席
  ========================= */

  const totalElement =
    document.getElementById(
      "summary-total"
    );


  if (totalElement) {

    totalElement.textContent =
      formatNumber(
        singleElected +
        proportionalElected
      );

  }


  /* =========================
     当確
  ========================= */

  const calledElement =
    document.getElementById(
      "summary-called"
    );


  if (calledElement) {

    calledElement.textContent =
      formatNumber(
        singleCalled +
        proportionalCalled
      );

  }


  /* =========================
     全国有権者数
  ========================= */

  const eligibleElement =
    document.getElementById(
      "nationalEligible"
    );


  if (eligibleElement) {

    eligibleElement.textContent =
      formatNumber(
        nationalEligible +
        proportionalEligible
      );

  }


  /* =========================
     全国投票者数
  ========================= */

  const votersElement =
    document.getElementById(
      "nationalVoters"
    );


  if (votersElement) {

    votersElement.textContent =
      formatNumber(
        nationalVoters +
        proportionalVoters
      );

  }


  /* =========================
     全国投票率
  ========================= */

  const turnoutElement =
    document.getElementById(
      "nationalTurnout"
    );


  if (turnoutElement) {

    const totalEligible =
      nationalEligible +
      proportionalEligible;


    const totalVoters =
      nationalVoters +
      proportionalVoters;


    const turnout =
      totalEligible > 0
        ? totalVoters /
          totalEligible *
          100
        : 0;


    turnoutElement.textContent =
      formatPercent(turnout);

  }


  /* =========================
     全国開票率
  ========================= */

  const openingElement =
    document.getElementById(
      "nationalOpening"
    );


  if (openingElement) {

    const totalVoters =
      nationalVoters +
      proportionalVoters;


    const opening =
      totalVoters > 0
        ? (
            nationalVotes +
            proportionalVotes
          ) /
          totalVoters *
          100
        : 0;


    openingElement.textContent =
      formatPercent(opening);

  }


  updateSeatChart();

}


/* ==================================================
   政党別議席集計
================================================== */

function calculatePartySeats() {
  const result = {};
  
  parties.forEach(party => {
    result[party] = {
      ruling: party === "自由民主党",
      seats: 0
    };
  });
  
  // 小選挙区
  Object.values(electionData.districts).forEach(districts => {
    districts.forEach(data => {
      
      const winner =
        data.candidates.find(c => c.elected);
      
      if (winner) {
        
        if (!result[winner.party]) {
          result[winner.party] = {
            ruling: winner.ruling === true,
            seats: 0
          };
        }
        
        result[winner.party].seats++;
      }
    });
  });
  
  // 比例代表
  Object.values(electionData.proportional).forEach(block => {
    block.parties.forEach(partyData => {
      
      if (!result[partyData.party]) {
        result[partyData.party] = {
          ruling: partyData.ruling === true,
          seats: 0
        };
      }
      
      result[partyData.party].seats +=
        partyData.electedSeats || 0;
    });
  });
  
  return result;
}

/* ==================================================
   与党・未確定・野党 半円議席グラフ
================================================== */

function updateSeatChart() {

  const container =
    document.getElementById("seatChart");

  if (!container) return;


  /* =========================
     政党別確定議席
  ========================= */

  const partySeats = {};

  parties.forEach(party => {
    partySeats[party] = 0;
  });


  /* =========================
     小選挙区
  ========================= */

  Object.values(electionData.districts)
    .forEach(districts => {

      districts.forEach(district => {

        const winner =
          district.candidates.find(
            candidate => candidate.elected
          );

        if (winner) {

          if (
            partySeats[winner.party] === undefined
          ) {
            partySeats[winner.party] = 0;
          }

          partySeats[winner.party]++;

        }

      });

    });


  /* =========================
     比例代表
  ========================= */

  Object.values(electionData.proportional)
    .forEach(block => {

      block.parties.forEach(partyData => {

        if (
          partySeats[partyData.party] === undefined
        ) {
          partySeats[partyData.party] = 0;
        }

        partySeats[partyData.party] +=
          Number(
            partyData.electedSeats || 0
          );

      });

    });


  /* =========================
     与党・野党を分類
     初期並び順を維持
  ========================= */

  let rulingSeats = 0;
  let oppositionSeats = 0;

  const rulingParties = [];
  const oppositionParties = [];


  parties.forEach(party => {

    const seats =
      partySeats[party] || 0;

    if (
      partyStatus[party] === "ruling"
    ) {

      rulingSeats += seats;

      rulingParties.push({
        party,
        seats
      });

    } else {

      oppositionSeats += seats;

      oppositionParties.push({
        party,
        seats
      });

    }

  });


  /* =========================
     総議席
  ========================= */

  const totalSeats =
    TOTAL_SINGLE_SEATS +
    TOTAL_PR_SEATS;


  /* =========================
     未確定議席
  ========================= */

  const confirmedSeats =
    rulingSeats +
    oppositionSeats;

  const vacantSeats =
    Math.max(
      0,
      totalSeats - confirmedSeats
    );


  /* =========================
     半円用割合
  ========================= */

  const rulingPercent =
    rulingSeats / totalSeats * 100;

  const vacantPercent =
    vacantSeats / totalSeats * 100;

  const oppositionPercent =
    oppositionSeats / totalSeats * 100;


  const rulingEnd =
    rulingPercent;

  const vacantEnd =
    rulingPercent +
    vacantPercent;


  /* =========================
     政党一覧
  ========================= */

  const rulingText =
    rulingParties
      .filter(item => item.seats > 0)
      .map(item =>
        `${partyNames[item.party] || item.party} ${formatNumber(item.seats)}議席`
      )
      .join("<br>");


  const oppositionText =
    oppositionParties
      .filter(item => item.seats > 0)
      .map(item =>
        `${partyNames[item.party] || item.party} ${formatNumber(item.seats)}議席`
      )
      .join("<br>");


  /* =========================
     表示
  ========================= */

  container.innerHTML = `

    <div class="half-seat-chart">

      <div class="half-seat-pie">

        <div
          class="half-seat-pie-color"
          style="
            background:
              conic-gradient(
                from 270deg,

                #2563eb
                0%
                ${rulingEnd / 2}%,

                #e5e7eb
                ${rulingEnd / 2}%
                ${vacantEnd / 2}%,

                #dc2626
                ${vacantEnd / 2}%
                50%,

                transparent
                50%
                100%
              );
          "
        ></div>


        <div class="half-seat-hole">

          <strong>
            ${formatNumber(confirmedSeats)}
          </strong>

          <span>
            確定議席
          </span>

        </div>

      </div>


      <div class="half-seat-info">

        <div class="half-seat-summary">

   小選挙区データ変更
================================================== */

function changeDistrictValue(
  pref,
  index,
  key,
  value
) {

  if (
    !electionData.districts[pref] ||
    !electionData.districts[pref][index]
  ) {
    return;
  }


  let number =
    Number(value);


  if (!isFinite(number) || number < 0) {
    number = 0;
  }


  electionData
    .districts[pref][index][key] =
    number;


  /*
   * 投票者数が有権者数を超えないようにする
   */

  const data =
    electionData.districts[pref][index];


  if (
    data.voters >
    data.eligibleVoters
  ) {

    data.voters =
      data.eligibleVoters;

  }


  displayDistrict();

  updateNationalSummary();

}


/* ==================================================
   候補者データ変更
================================================== */

function changeCandidateValue(
  pref,
  districtIndex,
  candidateIndex,
  key,
  value
) {

  const candidate =
    electionData
      .districts[pref]
      ?.[districtIndex]
      ?.candidates[candidateIndex];


  if (!candidate) {
    return;
  }


  if (key === "votes") {

    let number =
      Number(value);


    if (!isFinite(number) || number < 0) {
      number = 0;
    }


    candidate[key] =
      number;

  } else {

    candidate[key] =
      value;

  }


  displayDistrict();

  updateNationalSummary();

}

   小選挙区 議席確定
================================================== */

function toggleCandidateElected(
  pref,
  districtIndex,
  candidateIndex
) {

  const district =
    electionData
      .districts[pref]
      ?.[districtIndex];


  if (!district) {
    return;
  }


  const candidate =
    district.candidates[candidateIndex];


  if (!candidate) {

  /*

  displayDistrict();

  updateDistrictEditor();

/* ==================================================
   ドント方式
================================================== */

function calculateDHonntSeats(block) {

  const data =
    electionData.proportional[block];

  if (!data) {
    return;
  }

  const totalVotes =
    data.parties.reduce(
      (sum, party) =>
        sum + Number(party.votes || 0),
      0
    );

  const voters =
    Number(data.voters || 0);

  /* 開票率100%未満なら確定しない */

  if (
    voters <= 0 ||
    totalVotes < voters
  ) {
    return;
  }

  const seatCount =
    proportionalBlocks[block].seats;

  const quotients = [];

  data.parties.forEach(
    (party, partyIndex) => {

      const votes =
        Number(party.votes || 0);

      for (
        let divisor = 1;
        divisor <= seatCount;
        divisor++
      ) {

        quotients.push({
          partyIndex: partyIndex,
          value: votes / divisor
        });

      }

    }
  );

  /* 得票数の高い順に並べる */

  quotients.sort(
    (a, b) => b.value - a.value
  );

  /* 議席数をリセット */

  data.parties.forEach(
    party => {
      party.electedSeats = 0;
    }
  );

  /* 上位議席数分を配分 */

  for (
    let i = 0;
    i < seatCount;
    i++
  ) {

    const result =
      quotients[i];

    if (!result) {
      break;
    }

    data.parties[
      result.partyIndex
    ].electedSeats++;

  }

  /* 全議席確定 */

  data.parties.forEach(
    party => {

      if (party.electedSeats > 0) {
        party.called = true;
      }

    }
  );

}

/* ==================================================
   データ読み込み
================================================== */

function loadData() {

  const saved =
    localStorage.getItem(
      "electionSimulationData"
    );


  if (!saved) {

    createInitialData();

    return;

  }


  try {

    const data =
      JSON.parse(saved);


    /* 選挙データ */

    if (data.electionData) {

      electionData =
        data.electionData;

    } else {

      createInitialData();

    }


    /* 与党・野党設定 */

    if (data.partyStatus) {

      partyStatus =
        data.partyStatus;

    }


    /* 政党名 */

    if (data.partyNames) {

      partyNames =
        data.partyNames;

    }


  } catch (error) {

    console.error(
      "データ読み込みエラー",
      error
    );

    createInitialData();

  }

}
